<!doctype html>
<html lang="en">
  <head>
    <!-- Entire page is a controlled simulation, not captured Onshape DOM evidence. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock Onshape workspace</title>
    <style>
      body {
        font:
          16px system-ui,
          sans-serif;
        padding: 24px;
      }
      #fixture-top-plane,
      #host-control {
        position: fixed;
        left: 24px;
        width: 140px;
        height: 34px;
      }
      #fixture-top-plane {
        top: 32px;
      }
      #host-control {
        top: 80px;
      }
    </style>
  </head>
  <body>
    <h1>Mock Onshape workspace fixture</h1>
    <div role="tree" aria-label="Feature tree">
      <div
        role="group"
        aria-label="Default geometry"
        id="fixture-default-geometry"
      >
        <button id="fixture-top-plane" aria-label="Top" aria-pressed="false">
          <span>Top</span>
        </button>
      </div>
    </div>
    <button id="fixture-sketch" aria-label="Sketch">Start sketch</button>
    <div role="dialog" aria-label="Sketch 2" id="fixture-sketch-dialog" hidden>
      <span role="status" aria-label="Sketch plane: Top plane"
        >Sketch plane: Top plane</span
      >
      <button id="fixture-rectangle" aria-label="Rectangle">Rectangle</button>
      <button id="fixture-dimension" aria-label="Dimension">Dimension</button>
      <button id="fixture-finish" aria-label="Finish sketch">
        Finish sketch
      </button>
    </div>
    <button id="host-control">Host page control</button>
    <p>Host control clicks: <span id="host-click-count">0</span></p>
    <script>
      document
        .querySelector('#fixture-top-plane')
        ?.addEventListener('click', () => {
          document
            .querySelector('#fixture-top-plane')
            ?.setAttribute('aria-pressed', 'true');
        });
      document
        .querySelector('#fixture-sketch')
        ?.addEventListener('click', () => {
          document.querySelector('#fixture-sketch-dialog').hidden = false;
        });
      document
        .querySelector('#fixture-finish')
        ?.addEventListener('click', () => {
          document.querySelector('#fixture-sketch-dialog').hidden = true;
        });
      document.querySelector('#host-control')?.addEventListener('click', () => {
        const counter = document.querySelector('#host-click-count');
        if (counter)
          counter.textContent = String(Number(counter.textContent) + 1);
      });
    </script>
    <script type="module" src="./fixture.tsx"></script>
  </body>
</html>
