name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint experiments/native-search-fallback
      - run: pnpm exec tsc --ignoreConfig --noEmit --target es2022 --module nodenext --moduleResolution nodenext --types node --skipLibCheck experiments/native-search-fallback/playwright.config.ts experiments/native-search-fallback/fallback.spec.ts
      - run: node --test experiments/native-search-fallback/fallback.test.mjs
      - run: pnpm reference:validate
      - run: pnpm reference:test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm build:edge
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config experiments/native-search-fallback/playwright.config.ts
      - run: pnpm test:e2e
      - run: pnpm package:browsers
      - uses: actions/upload-artifact@v4
        with:
          name: leqad-browser-packages
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          include-hidden-files: true
