name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Diagnose exact formatting diff for lesson tests
        run: |
          pnpm exec prettier --write apps/extension/src/components/panel/AssistantPanel.test.tsx apps/extension/tests/e2e/panel.spec.ts
          git diff --color=never -- apps/extension/src/components/panel/AssistantPanel.test.tsx apps/extension/tests/e2e/panel.spec.ts
          git diff --exit-code -- apps/extension/src/components/panel/AssistantPanel.test.tsx apps/extension/tests/e2e/panel.spec.ts
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm build:edge
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm package:browsers
      - uses: actions/upload-artifact@v4
        with:
          name: leqad-browser-packages
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          include-hidden-files: true
